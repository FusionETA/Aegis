<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/console.css">
<title>Argus Console</title>
<script src="/assets/app.js" defer></script>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="brand" href="#checks" aria-label="Argus home"><svg viewBox="0 0 34 24" aria-hidden="true"><ellipse cx="17" cy="12" rx="16" ry="11" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><ellipse cx="17" cy="12.6" rx="9.5" ry="7" fill="var(--accent)"/><ellipse cx="17" cy="13" rx="4.6" ry="3.8" fill="var(--ink)"/><circle cx="15.4" cy="11.6" r="1.3" fill="var(--surface)"/></svg><b>Argus</b></a>
    <nav aria-label="Views">
      <a href="#checks" data-view="checks">Checks</a>
      <a href="#setup" data-view="setup">Setup</a>
      <a href="#activity" data-view="activity">Activity</a>
      <a href="#people" data-view="people" hidden>People</a>
    </nav>
    <div class="who"><span id="who"></span><a href="#account">Account</a><button class="btn small" id="signout" type="button">Sign out</button></div>
  </header>
  <main>
    <section data-panel="checks" id="view-checks" aria-label="Checks"></section>
    <section data-panel="setup" id="view-setup" aria-label="Setup" hidden></section>
    <section data-panel="activity" id="view-activity" aria-label="Activity" hidden></section>
    <section data-panel="people" id="view-people" aria-label="People" hidden></section>
    <section data-panel="account" id="view-account" aria-label="Account" hidden></section>
  </main>
</div>
<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
