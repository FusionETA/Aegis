<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/assets/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Argus">
<meta name="theme-color" content="#f2f5f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1418" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/assets/console.css">
<title>Argus Console</title>
<script src="/assets/app.js" defer></script>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="brand" href="#checks" aria-label="Argus home"><svg class="mark" viewBox="426 424 406 263" fill="currentColor" aria-hidden="true"><path d="M519,506 C560,410 692,393 828,510 C732,463 600,418 519,506 Z"/> <path d="M430,586 C480,550 545,500 620,489 C700,496 762,526 818,533 L612,683 L757,541 C720,526 680,511 640,509 L603,509 C562,516 510,540 473,566 C515,566 560,590 604,635 C578,616 532,590 487,581 C462,577 442,580 430,586 Z"/> <path fill-rule="evenodd" d="M555.5,529 A67,67 0 1 0 688.5,529 Z M564,529 A58,58 0 1 0 680,529 Z"/> <circle cx="622" cy="526" r="23"/></svg><svg class="word" viewBox="-2 -1 246 42" fill="none" stroke="currentColor" stroke-width="4.4" aria-hidden="true"><path d="M0,40 L17,0 L34,40"/> <path d="M58,40 V1.8 H72 A10.6,10.6 0 0 1 72,23 H58 M71,23 L84,40"/> <path d="M139,8.5 A18.5,20 0 1 0 142,23 H128"/> <path d="M166,0 V25 A14.5,14.5 0 0 0 195,25 V0"/> <path d="M240,7 C237,2.5 232.5,1.8 229,1.8 C222,1.8 218.5,5.5 218.5,10.5 C218.5,17 224,18.5 229.5,20 C235.5,21.6 241.5,23.5 241.5,30 C241.5,35.5 237,38.2 230,38.2 C224.5,38.2 219.5,36.5 217,32"/></svg></a>
    <nav class="views" aria-label="Views">
      <a href="#checks" data-view="checks">Checks</a>
      <a href="#apps" data-view="apps">Apps</a>
      <a href="#channels" data-view="channels">Channels</a>
      <a href="#activity" data-view="activity">Activity</a>
      <a href="#people" data-view="people" hidden>People</a>
    </nav>
    <div class="who"><a href="#account" data-view="account" id="who" title="Your account"></a><button class="btn small" id="signout" type="button">Sign out</button></div>
  </header>
  <main>
    <section data-panel="checks" id="view-checks" aria-label="Checks"></section>
    <section data-panel="check" id="view-check" aria-label="Check" hidden></section>
    <section data-panel="apps" id="view-apps" aria-label="Apps" hidden></section>
    <section data-panel="channels" id="view-channels" aria-label="Channels" hidden></section>
    <section data-panel="activity" id="view-activity" aria-label="Activity" hidden></section>
    <section data-panel="people" id="view-people" aria-label="People" hidden></section>
    <section data-panel="account" id="view-account" aria-label="Account" hidden></section>
  </main>
</div>
<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
