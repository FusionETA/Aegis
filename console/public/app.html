<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/assets/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Argus">
<meta name="theme-color" content="#f2f5f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1418" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/assets/console.css">
<title>Argus Console</title>
<script src="/assets/app.js" defer></script>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="brand" href="#checks" aria-label="Argus home"><!-- brand --><svg class="mark" viewBox="426 424 406 263" fill="currentColor" aria-hidden="true"> <path d="M519,506 C560,410 692,393 828,510 C732,463 600,418 519,506 Z"/> <path d="M430,586 C480,550 545,500 620,489 C700,496 762,526 818,533 L612,683 L757,541 C720,526 680,511 640,509 L603,509 C562,516 510,540 473,566 C515,566 560,590 604,635 C578,616 532,590 487,581 C462,577 442,580 430,586 Z"/> <path fill-rule="evenodd" d="M555.5,529 A67,67 0 1 0 688.5,529 Z M564,529 A58,58 0 1 0 680,529 Z"/> <circle cx="622" cy="526" r="23"/></svg><svg class="word" viewBox="332 719 588 82" fill="currentColor" aria-hidden="true"> <defs><clipPath id="argus-cap"><rect x="300" y="723.3" width="700" height="73.4"/></clipPath></defs> <path d="M336,796.7 L376,723.3 L415.7,796.7 L405.7,796.7 L376,741.7 L346,796.7 Z"/> <g fill="none" stroke="currentColor" stroke-width="9" clip-path="url(#argus-cap)"> <path d="M483.3,800 V727.8 H519 A16.35,16.35 0 0 1 519,760.5 H483.3 M505,760.5 L542,802"/> <path d="M667.6,738.8 A33.75,33.75 0 1 0 675.45,760.5 H645"/> <path d="M746.3,720 V767.7 A26,26 0 0 0 798.3,767.7 V720"/> <path d="M910.5,735 C904,729 896.5,727.5 889.5,727.5 C877.5,727.5 869.5,734 869.5,743.5 C869.5,754 880.5,757 891.5,760 C905,763.5 915,768 915,778 C915,788 904,793.7 890.5,793.7 C879,793.7 870,789.5 866,783"/> </g></svg><!-- /brand --></a>
    <nav class="views" aria-label="Views">
      <a href="#checks" data-view="checks"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>Checks</span><b class="badge" id="fail-badge" hidden></b></a>
      <a href="#apps" data-view="apps"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg><span>Apps</span></a>
      <a href="#channels" data-view="channels"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 6.5 2.5 8.5 2.5 8.5h-17S6 15.5 6 9"/><path d="M10.3 20.5a1.9 1.9 0 0 0 3.4 0"/></svg><span>Channels</span></a>
      <a href="#activity" data-view="activity"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Activity</span></a>
      <a href="#people" data-view="people" hidden><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20v-1a5 5 0 0 1 5-5h3a5 5 0 0 1 5 5v1"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"/><path d="M18.5 14.2a5 5 0 0 1 3 4.8v1"/></svg><span>People</span></a>
      <a href="#account" data-view="account" class="you"><span class="initials" id="you-initials" aria-hidden="true"></span><span>You</span></a>
    </nav>
    <div class="who"><a href="#account" data-view="account" id="who" title="Your account"></a><button class="btn small" id="signout" type="button">Sign out</button></div>
  </header>
  <main>
    <section data-panel="checks" id="view-checks" aria-label="Checks"></section>
    <section data-panel="check" id="view-check" aria-label="Check" hidden></section>
    <section data-panel="apps" id="view-apps" aria-label="Apps" hidden></section>
    <section data-panel="channels" id="view-channels" aria-label="Channels" hidden></section>
    <section data-panel="activity" id="view-activity" aria-label="Activity" hidden></section>
    <section data-panel="people" id="view-people" aria-label="People" hidden></section>
    <section data-panel="account" id="view-account" aria-label="Account" hidden></section>
  </main>
</div>
<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
