<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/console.css">
<title>Choose a password · Argus</title>
<script src="/assets/setup.js" defer></script>
</head>
<body>
<div class="auth">
  <form class="card" id="setup" novalidate>
    <a class="brand" href="/"><svg viewBox="0 0 34 24" aria-hidden="true"><ellipse cx="17" cy="12" rx="16" ry="11" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><ellipse cx="17" cy="12.6" rx="9.5" ry="7" fill="var(--accent)"/><ellipse cx="17" cy="13" rx="4.6" ry="3.8" fill="var(--ink)"/><circle cx="15.4" cy="11.6" r="1.3" fill="var(--surface)"/></svg><b>Argus</b></a>
    <header><h1 id="title">Choose your password</h1><p id="intro">Checking your link…</p></header>
    <div class="form" id="fields" hidden>
      <label for="pw1">New password<small>At least 10 characters.</small><input type="password" id="pw1" autocomplete="new-password" required></label>
      <label for="pw2">Type it again<input type="password" id="pw2" autocomplete="new-password" required></label>
      <div class="actions"><button class="btn primary" type="submit" id="go">Save and sign in</button></div>
    </div>
    <p class="msg err" id="err" role="alert" hidden></p>
  </form>
</div>
</body>
</html>
